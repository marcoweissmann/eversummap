name: Update sales data

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - run: pip install pdfplumber requests

    - name: Update sales data
      id: update
      run: python scripts/update_sales.py

    - name: Commit updated GeoJSON
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add data/haeuser_final.geojson data/preis_historie.json
        git commit -m "update sales data" || echo "no changes"
        git push

    # Läuft nach dem Commit: Warnungen aus der Plausibilitätsprüfung machen den
    # Lauf rot (GitHub verschickt dann eine Benachrichtigung). Details stehen
    # in der Zusammenfassung des Laufs.
    - name: Plausibilitätsprüfung
      if: steps.update.outputs.warnungen != '0'
      run: |
        echo "::error::Plausibilitätsprüfung mit Warnungen – Details in der Zusammenfassung dieses Laufs."
        exit 1
