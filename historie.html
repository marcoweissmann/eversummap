<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eversummap historie</title>

<link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">

<style>
:root{
  --green:#2f6b4f;
  --green-deep:#1b4332;
  --green-soft:#e7efe8;
  --wood:#a9743f;
  --bg:#f6f4ee;
  --ink:#23241f;
  --muted:#6f6f64;
  --line:#e7e2d6;
  --card:#ffffff;
  --down:#2f7d4f;
  --up:#b4452f;
  --shadow:0 6px 24px rgba(27,43,31,.10), 0 1px 3px rgba(27,43,31,.06);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:"Hanken Grotesk", system-ui, sans-serif;
  color:var(--ink); background:var(--bg);
  font-size:14px; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% -8%, rgba(47,107,79,.06), transparent 42%);
}

/* ---------- Header ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:14px;
  padding:14px clamp(16px,4vw,40px);
  background:rgba(246,244,238,.86);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:11px; min-width:0; }
.brand-mark{ width:34px; height:34px; flex:none; display:grid; place-items:center; background:var(--green); border-radius:9px; box-shadow:0 2px 8px rgba(47,107,79,.35); }
.brand-mark svg{ width:20px; height:20px; }
.brand-name{ font-family:"Newsreader",serif; font-weight:600; font-size:18px; color:var(--green-deep); white-space:nowrap; }
.brand-sub{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
.brand-text{ display:flex; flex-direction:column; line-height:1.05; min-width:0; }
.spacer{ flex:1; }
.back-link{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none; white-space:nowrap;
  background:var(--green); color:#fff; font-weight:600; font-size:13px;
  padding:9px 14px; border-radius:10px; box-shadow:0 2px 8px rgba(47,107,79,.3);
  transition:background .12s ease, transform .12s ease;
}
.back-link:hover{ background:var(--green-deep); transform:translateY(-1px); }
.back-link svg{ width:15px; height:15px; }

/* ---------- Page ---------- */
.wrap{ max-width:1120px; margin:0 auto; padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 64px; }

.page-hero{ margin:8px 0 30px; }
.page-hero h1{
  font-family:"Newsreader",serif; font-weight:600;
  font-size:clamp(28px,5vw,42px); line-height:1.05; margin:0 0 8px;
  color:var(--green-deep); letter-spacing:-.3px;
}
.page-hero p{ margin:0; color:var(--muted); font-size:15px; max-width:60ch; }

.section{
  display:flex; align-items:baseline; gap:12px;
  font-family:"Newsreader",serif; font-size:22px; font-weight:600;
  color:var(--green-deep); margin:40px 0 16px;
}
.section::after{ content:""; flex:1; height:1px; background:var(--line); }
.section .count{ font-family:"Hanken Grotesk",sans-serif; font-size:13px; font-weight:600; color:var(--muted); }

/* ---------- KPI ---------- */
.kpis{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; }
@media (max-width:720px){ .kpis{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.kpi{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--green); opacity:.85; }
.kpi .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; }
.kpi .value{ font-family:"Newsreader",serif; font-size:27px; font-weight:600; color:var(--green-deep); margin-top:5px; line-height:1.05; }
.kpi .sub2{ font-size:12px; color:var(--muted); margin-top:4px; }
.note{ color:var(--muted); font-size:12.5px; font-style:italic; margin:12px 2px 0; }

/* ---------- Charts ---------- */
.charts{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
@media (max-width:720px){ .charts{ grid-template-columns:minmax(0,1fr); } }
.lc{ position:relative; touch-action:pan-y; }
.lc-tip{ position:absolute; pointer-events:none; opacity:0; transition:opacity .1s; background:var(--ink); color:#fff; border-radius:8px; padding:5px 9px; font-size:12px; line-height:1.3; white-space:nowrap; display:flex; flex-direction:column; }
.lc-tip span{ color:#c9c8bd; font-size:11px; }
.lc-tip b{ font-weight:600; }
.chart-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); }
.chart-card h3{ font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 10px; font-weight:600; }

/* ---------- Offer cards ---------- */
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 18px 16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.card h2{ font-family:"Newsreader",serif; font-size:19px; font-weight:600; margin:0; color:var(--ink); line-height:1.1; }
.card .big-price{ font-family:"Newsreader",serif; font-size:26px; font-weight:600; color:var(--green-deep); white-space:nowrap; line-height:1; }
.card.sold{ background:#faf8f3; }
.card.sold h2{ color:var(--muted); }

.statline{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 4px; }
.statbox{ background:var(--bg); border-radius:10px; padding:9px 10px; }
.statbox .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
.statbox .v{ font-size:14.5px; font-weight:600; margin-top:2px; }

.badge{ display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; }
.badge.cheap{ background:#e6f4ea; color:#1a7f37; }
.badge.exp{ background:#fbe9e6; color:#b4452f; }
.badge.mid{ background:#efece4; color:#6f6f64; }

.price-history{ margin:12px 0 2px; }
.price-history svg{ display:block; width:100%; }
.price-delta{ font-size:13px; font-weight:600; margin:4px 0 6px; display:flex; align-items:center; gap:6px; }
.price-delta.down{ color:var(--down); }
.price-delta.up{ color:var(--up); }
.price-delta.flat{ color:var(--muted); }
.hint{ color:var(--muted); font-style:italic; font-size:12.5px; margin:12px 0 6px; padding:10px 12px; background:var(--bg); border-radius:10px; }

.htable{ border-collapse:collapse; width:100%; margin-top:12px; }
.htable th{ text-align:left; border-bottom:1px solid var(--line); padding:6px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:600; }
.htable td{ padding:7px 8px; border-bottom:1px solid #f1ede3; font-size:13px; }
.htable tr:last-child td{ border-bottom:none; }

.empty{ color:var(--muted); padding:40px 20px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:16px; }
/* ---------- Overview map ---------- */
.ovmap-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow); }
.ovmap{ height:400px; width:100%; border-radius:12px; overflow:hidden; background:var(--bg); isolation:isolate; } /* eigene Ebene: Karte bleibt unter dem fixierten Header */
.ovmap-legend{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:12px; padding:2px 4px 0; }
.ovmap-legend .li{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); }
.ovmap-legend .sw{ width:13px; height:13px; border-radius:4px; border:1px solid rgba(0,0,0,.12); }
.leaflet-container{ font-family:"Hanken Grotesk", sans-serif; }
.leaflet-control-zoom{ border:none !important; box-shadow:var(--shadow) !important; border-radius:10px !important; overflow:hidden; }
.leaflet-control-zoom a{ width:34px !important; height:34px !important; line-height:34px !important; color:var(--green-deep) !important; background:#fff !important; border:none !important; }
.leaflet-control-zoom a:hover{ background:var(--green-soft) !important; }
.leaflet-control-attribution{ background:rgba(255,255,255,.82) !important; font-size:10px !important; }
.leaflet-control-attribution a{ color:var(--green) !important; }
.ov-pin .pp{ position:relative; display:inline-flex; align-items:center; background:var(--green); color:#fff; font-weight:700; font-size:12px; padding:4px 9px; border-radius:999px; box-shadow:0 4px 10px rgba(27,43,31,.3),0 0 0 2px #fff; transform:translate(-50%, calc(-100% - 6px)); white-space:nowrap; } /* Spitze auf Oberkante des Grundrisses, Pille darüber */
.ov-pin .pp::after{ content:""; position:absolute; left:50%; bottom:-4px; width:8px; height:8px; background:var(--green); transform:translateX(-50%) rotate(45deg); }
.ov-pin.sold .pp{ background:var(--wood); box-shadow:0 4px 10px rgba(122,82,48,.32),0 0 0 2px #fff; }
.ov-pin.sold .pp::after{ background:var(--wood); }
.ov-pin.compact:not(:hover) .pp{ width:13px; height:13px; padding:0; font-size:0; transform:translate(-50%,-50%); }
.ov-pin.compact:not(:hover) .pp::after{ display:none; }
.leaflet-popup.ov-popup .leaflet-popup-content-wrapper{ border-radius:13px; box-shadow:0 14px 36px rgba(27,43,31,.2); border:1px solid var(--line); padding:0; overflow:hidden; }
.leaflet-popup.ov-popup .leaflet-popup-content{ margin:0; width:212px !important; }
.ovpop-h{ padding:11px 14px; font-family:"Newsreader",serif; font-weight:600; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--green),var(--green-deep)); line-height:1.1; }
.ovpop.sold .ovpop-h{ background:linear-gradient(135deg,var(--wood),#6f4a2c); }
.ovpop-b{ padding:10px 14px 12px; font-size:13px; }
.ovpop-b .r{ display:flex; justify-content:space-between; gap:14px; padding:3px 0; color:var(--muted); }
.ovpop-b .r b{ font-weight:600; color:var(--ink); }
.badge.long{ background:#fbf0dc; color:#8a5a14; }

/* zuklappbarer Verlauf in den Hauskarten */
.cards{ align-items:start; }
.hist-details{ margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.hist-details summary{ cursor:pointer; font-size:12.5px; font-weight:600; color:var(--green-deep); list-style:none; display:flex; align-items:center; gap:6px; }
.hist-details summary::-webkit-details-marker{ display:none; }
.hist-details summary::before{ content:"▸"; font-size:11px; transition:transform .15s; }
.hist-details[open] summary::before{ transform:rotate(90deg); }
.hist-details .htable{ margin-top:6px; }

/* Kennzahl Preisspanne: Kurzform auf schmalen Bildschirmen */
.kpi .v-short{ display:none; }
@media (max-width:560px){
  .kpi .v-long{ display:none; }
  .kpi .v-short{ display:inline; white-space:nowrap; font-size:21px; }
  .kpi .value{ font-size:24px; }
  /* Überschriften: Zusatz unter die Überschrift statt daneben */
  .section{ flex-wrap:wrap; row-gap:2px; }
  .section::after{ display:none; }
  .section .count{ flex-basis:100%; }
}
.badge + .badge{ margin-left:6px; }
.listed{ font-size:12.5px; color:var(--muted); margin-top:6px; }

/* ---------- Änderungs-Feed ---------- */
.feed{ background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:4px 18px; }
.feed-day{ display:grid; grid-template-columns:96px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid #f1ede3; }
.feed-day:last-of-type{ border-bottom:none; }
.feed-day.more{ display:none; }
.feed.open .feed-day.more{ display:grid; }
.feed-date{ font-size:12.5px; font-weight:600; color:var(--muted); padding-top:2px; }
.feed-item{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.45; padding:3px 0; }
.feed-item b{ font-weight:600; }
.fi-ico{ flex:none; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:700; color:#fff; }
.fi-new{ background:var(--green); } .fi-down{ background:var(--down); } .fi-up{ background:var(--up); }
.fi-pacht{ background:var(--wood); } .fi-sold{ background:#8a8a7e; } .fi-start{ background:#c9c4b5; }
.feed-toggle{ display:block; width:100%; margin:4px 0 12px; padding:9px; border:none; border-radius:10px; background:var(--green-soft); color:var(--green-deep); font:600 13px "Hanken Grotesk",sans-serif; cursor:pointer; }
.feed-toggle:hover{ background:#dceadf; }
@media (max-width:560px){ .feed-day{ grid-template-columns:1fr; gap:4px; } }

/* ---------- Scatter ---------- */
.scatter-legend{ display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--muted); }
.scatter-legend .d{ width:11px; height:11px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
.scatter-legend .dash{ display:inline-block; width:18px; border-top:2px dashed #b9b3a3; margin-right:6px; vertical-align:middle; }

/* ---------- Cost calculator ---------- */
.cost-controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.cost-controls label{ font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; }
.cost-controls .yr{ font-family:"Newsreader",serif; font-size:19px; color:var(--green-deep); font-weight:600; white-space:nowrap; }
input[type=range]{ accent-color:var(--green); flex:1; min-width:170px; height:5px; cursor:pointer; }
.cost-legend{ display:flex; gap:18px; margin:0 0 14px; font-size:12.5px; color:var(--muted); }
.cost-legend .d{ width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:middle; }
.cost-row{ display:grid; grid-template-columns:148px 1fr auto; gap:14px; align-items:center; padding:8px 0; }
.cost-row .nm{ font-size:13.5px; font-weight:600; min-width:0; }
.cost-track{ height:24px; border-radius:7px; background:var(--bg); overflow:hidden; display:flex; }
.cost-seg-kauf{ background:var(--green); height:100%; transition:width .25s ease; }
.cost-seg-pacht{ background:var(--wood); height:100%; transition:width .25s ease; }
.cost-total{ font-family:"Newsreader",serif; font-weight:600; font-size:15px; color:var(--green-deep); white-space:nowrap; }
@media (max-width:560px){
  .cost-row{ grid-template-columns:96px 1fr; }
  .cost-row .cost-total{ grid-column:2; text-align:right; margin-top:-2px; }
}
@media (max-width:760px){
  .brand-sub{ display:none; }
  .back-link span{ display:none; }
  .back-link{ padding:9px; }
  .ovmap{ height:320px; }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C10.5 3 6.5 7.2 6.5 12.6 6.5 19.6 16 29 16 29s9.5-9.4 9.5-16.4C25.5 7.2 21.5 3 16 3z" fill="#fff"/><path d="M16 7.6 21.4 12.4V18H10.6v-5.6z" fill="#2f6b4f"/><rect x="14.8" y="14.4" width="2.4" height="3.6" rx=".4" fill="#fff"/></svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">Waldferiendorf Eversum</span>
      <span class="brand-sub">Preis-Historie &amp; Marktanalyse</span>
    </div>
  </div>
  <div class="spacer"></div>
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6-6 6-6"/><path d="M3 12h13a5 5 0 0 1 0 10h-1"/></svg>
    <span>Zurück zur Karte</span>
  </a>
</header>

<div class="wrap">
  <div class="page-hero">
    <h1>Preis-Historie &amp; Analyse</h1>
    <p>Marktüberblick, Preisentwicklung und Detailverläufe der Ferienhäuser im Waldferiendorf Eversum.</p>
  </div>
  <div id="content"></div>
</div>

<script>
function formatPrice(value){
  if(value==null) return "–";
  return new Intl.NumberFormat('de-DE').format(Math.round(value)) + "\u00A0€";
}
function formatMonth(iso){
  const d=new Date(iso);
  return String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
}
function median(arr){
  if(!arr.length) return null;
  const a=[...arr].sort((x,y)=>x-y), m=Math.floor(a.length/2);
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
}
function mean(arr){ return arr.length ? arr.reduce((s,x)=>s+x,0)/arr.length : null; }

// Hat sich der Angebotspreis jemals geändert? (Pachtänderungen zählen nicht)
function priceChanged(pts){ return new Set(pts.map(p=>p.preis)).size>1; }

// Kleine Preislinie je Haus: zeitgetreu, als Stufe, bis heute
function buildSparkline(punkte){
  const pts=(punkte||[]).filter(p=>p.preis!=null);
  if(!priceChanged(pts)) return "";
  const W=300,H=56,pad=5;
  const t0=new Date(pts[0].datum).getTime();
  const tEnd=Math.max(new Date(todayIso()).getTime(), new Date(pts[pts.length-1].datum).getTime());
  const v=pts.map(p=>p.preis), min=Math.min(...v), max=Math.max(...v);
  const X=t=>(t-t0)/((tEnd-t0)||1)*W;
  const Y=val=>pad+(H-2*pad)*(1-(val-min)/(max-min));
  let line="";
  pts.forEach((p,i)=>{
    const x=X(new Date(p.datum).getTime()).toFixed(1), y=Y(p.preis).toFixed(1);
    line+= i===0 ? `M${x},${y}` : `H${x}V${y}`;
  });
  line+=`H${W}`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="${H}">
    <defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6b4f" stop-opacity=".16"/><stop offset="1" stop-color="#2f6b4f" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}V${H}H0Z" fill="url(#spg)"/>
    <path d="${line}" fill="none" stroke="#2f6b4f" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function priceDeltaHtml(punkte){
  const pts=(punkte||[]).filter(p=>p.preis!=null);
  if(!pts.length) return "";
  const first=pts[0], last=pts[pts.length-1], diff=last.preis-first.preis;
  if(!priceChanged(pts)) return `<div class="price-delta flat">→ Preis unverändert seit ${formatMonth(first.datum)}</div>`;
  const pct=Math.round(diff/first.preis*100);
  const cls=diff<0?"down":"up";
  const sign=diff<0?"−":"+";
  return `<div class="price-delta ${cls}">${diff<0?"▼":"▲"} ${sign}${formatPrice(Math.abs(diff))} (${sign}${Math.abs(pct)}&nbsp;%) seit ${formatMonth(first.datum)}</div>`;
}

// ---------- Zeitreihen-Diagramme (Marktentwicklung) ----------
// Werte ändern sich sprunghaft an einem Tag und bleiben bis zur nächsten
// Änderung gleich -> Stufenlinie auf einer zeitgetreuen Achse bis heute.
const MONATE=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const lineCharts={};   // key -> { series, fmt }

// "Schöne" Achsenwerte (Schritte 1-2-5) um min..max
function niceTicks(min, max, count){
  if(min===max){ const d=Math.abs(min)*0.1||1; min-=d; max+=d; }
  const raw=(max-min)/count, mag=Math.pow(10, Math.floor(Math.log10(raw)));
  const step=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw);
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const ticks=[];
  for(let v=lo; v<=hi+step/2; v+=step) ticks.push(Math.round(v*1e6)/1e6);
  return ticks;
}

function lineChartSlot(key, series, fmt){
  lineCharts[key]={ series, fmt };
  return `<div class="lc" data-key="${key}"></div>`;
}

function drawLineChart(el){
  const cfg=lineCharts[el.dataset.key];
  const s=cfg?.series||[];
  if(!s.length){ el.innerHTML='<p class="hint">Noch keine Daten.</p>'; el._geo=null; return; }

  const W=Math.max(240, el.clientWidth), H=170, mL=64, mR=14, mT=10, mB=26;
  const day=86400000;
  const t0=new Date(s[0].datum).getTime();
  const tEnd=Math.max(new Date(todayIso()).getTime(), new Date(s[s.length-1].datum).getTime());
  const span=(tEnd-t0)||day;
  const X=t=>mL+(t-t0)/span*(W-mL-mR);
  const ticks=niceTicks(Math.min(...s.map(p=>p.wert)), Math.max(...s.map(p=>p.wert)), 3);
  const lo=ticks[0], hi=ticks[ticks.length-1];
  const Y=v=>mT+(1-(v-lo)/(hi-lo))*(H-mT-mB);
  const r1=v=>v.toFixed(1);

  // Stufenlinie bis heute
  let line="";
  s.forEach((p,i)=>{
    const x=r1(X(new Date(p.datum).getTime())), y=r1(Y(p.wert));
    line+= i===0 ? `M${x},${y}` : `H${x}V${y}`;
  });
  line+=`H${r1(X(tEnd))}`;
  const area=`${line}V${r1(Y(lo))}H${r1(X(t0))}Z`;

  const txt=(x,y,t,anchor="start")=>`<text x="${r1(x)}" y="${r1(y)}" font-size="11" fill="#8a897d" font-family="Hanken Grotesk" text-anchor="${anchor}">${t}</text>`;

  // y-Achse: dezente Gitterlinien + Werte im linken Rand
  let grid="";
  ticks.forEach(v=>{
    grid+=`<line x1="${mL}" x2="${W-mR}" y1="${r1(Y(v))}" y2="${r1(Y(v))}" stroke="${v===lo?"#e0dccf":"#f1ede3"}"/>`;
    grid+=txt(mL-8, Y(v)+4, cfg.fmt(v), "end");
  });

  // x-Achse: Monatsanfänge
  let months="";
  const d=new Date(t0); d.setDate(1); d.setMonth(d.getMonth()+1);
  for(; d.getTime()<=tEnd; d.setMonth(d.getMonth()+1)){
    const x=X(d.getTime());
    months+=`<line x1="${r1(x)}" x2="${r1(x)}" y1="${r1(Y(lo))}" y2="${r1(Y(lo)+4)}" stroke="#e0dccf"/>`;
    months+=txt(x, H-6, MONATE[d.getMonth()]+(d.getMonth()===0?" "+d.getFullYear():""), "middle");
  }

  const dots=s.map(p=>`<circle cx="${r1(X(new Date(p.datum).getTime()))}" cy="${r1(Y(p.wert))}" r="4" fill="#2f6b4f" stroke="#fff" stroke-width="2"/>`).join("");

  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
    <defs><linearGradient id="lcg-${el.dataset.key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6b4f" stop-opacity=".14"/><stop offset="1" stop-color="#2f6b4f" stop-opacity="0"/></linearGradient></defs>
    ${grid}${months}
    <path d="${area}" fill="url(#lcg-${el.dataset.key})"/>
    <path d="${line}" fill="none" stroke="#2f6b4f" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <line class="lc-cross" y1="${mT}" y2="${r1(Y(lo))}" stroke="#b9b3a3" stroke-dasharray="3 3" visibility="hidden"/>
    <circle class="lc-dot" r="5" fill="#2f6b4f" stroke="#fff" stroke-width="2" visibility="hidden"/>
  </svg><div class="lc-tip"></div>`;
  el._geo={ X, Y, t0, tEnd, s, mL, mR, W, fmt:cfg.fmt };
}

// Hover: Fadenkreuz + Tooltip mit dem Wert, der an diesem Tag galt
function bindLineChartHover(el){
  const hide=()=>{
    el.querySelector('.lc-cross')?.setAttribute('visibility','hidden');
    el.querySelector('.lc-dot')?.setAttribute('visibility','hidden');
    const tip=el.querySelector('.lc-tip'); if(tip) tip.style.opacity=0;
  };
  el.addEventListener('pointerleave', hide);
  el.addEventListener('pointermove', e=>{
    const g=el._geo; if(!g) return;
    const rect=el.getBoundingClientRect();
    const x=Math.min(Math.max(e.clientX-rect.left, g.mL), g.W-g.mR);
    const t=g.t0+(x-g.mL)/(g.W-g.mL-g.mR)*(g.tEnd-g.t0);
    let p=g.s[0];
    for(const q of g.s) if(new Date(q.datum).getTime()<=t) p=q;
    const cross=el.querySelector('.lc-cross'), dot=el.querySelector('.lc-dot'), tip=el.querySelector('.lc-tip');
    cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.setAttribute('visibility','visible');
    dot.setAttribute('cx',x); dot.setAttribute('cy',g.Y(p.wert)); dot.setAttribute('visibility','visible');
    tip.innerHTML=`<span>${formatDate(new Date(t).toISOString().slice(0,10))}</span><b>${g.fmt(p.wert)}</b>`;
    const tw=tip.offsetWidth;
    tip.style.left=Math.min(Math.max(x-tw/2, 0), g.W-tw)+"px";
    tip.style.top=Math.max(g.Y(p.wert)-46, 0)+"px";
    tip.style.opacity=1;
  });
}

function initLineCharts(){
  const els=[...document.querySelectorAll('.lc')];
  els.forEach(el=>{ drawLineChart(el); bindLineChartHover(el); });
  let timer;
  window.addEventListener('resize', ()=>{ clearTimeout(timer); timer=setTimeout(()=>els.forEach(drawLineChart), 150); });
}

function reconstructMarket(history, flaecheById){
  // Stichtage: jede Preis-/Pachtänderung und jeder Tag, an dem ein Haus vom Markt ging
  const dates=new Set();
  Object.values(history).forEach(h=>{
    (h.punkte||[]).forEach(p=>dates.add(p.datum));
    if(h.verkauft_am) dates.add(h.verkauft_am);
  });
  const sorted=[...dates].sort();
  const priceSeries=[], qmSeries=[], pachtSeries=[], countSeries=[];
  sorted.forEach(D=>{
    const preise=[], qm=[], pachten=[];
    Object.entries(history).forEach(([id,h])=>{
      const pts=(h.punkte||[]).filter(p=>p.datum<=D);
      if(!pts.length) return;
      if(h.verkauft_am && D>=h.verkauft_am) return;
      const last=pts[pts.length-1];
      if(last.preis==null) return;
      preise.push(last.preis);
      if(last.pacht!=null) pachten.push(last.pacht);
      const fl=h.flaeche || flaecheById[id];
      if(fl) qm.push(last.preis/fl);
    });
    if(preise.length){ priceSeries.push({datum:D,wert:median(preise)}); countSeries.push({datum:D,wert:preise.length}); }
    if(qm.length) qmSeries.push({datum:D,wert:median(qm)});
    if(pachten.length) pachtSeries.push({datum:D,wert:median(pachten)});
  });
  return {priceSeries, qmSeries, pachtSeries, countSeries};
}

function badge(qm, medianQm){
  if(qm==null||medianQm==null) return "";
  const pct=Math.round((qm-medianQm)/medianQm*100);
  if(pct<=-5) return `<span class="badge cheap">−${Math.abs(pct)}&nbsp;% ggü. Median</span>`;
  if(pct>=5)  return `<span class="badge exp">+${pct}&nbsp;% ggü. Median</span>`;
  return `<span class="badge mid">≈ Median</span>`;
}

function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function formatDate(iso){ if(!iso) return "–"; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y}`; }
// 28500 -> "28,5" (für "28,5 – 75 T€")
function kurzT(v){ return (v/1000).toLocaleString('de-DE',{ maximumFractionDigits:1 }); }
function todayIso(){ return new Date().toISOString().slice(0,10); }

// Ab so vielen Tagen gilt ein Angebot als "lange im Angebot"
const LONG_LISTED_DAYS = 60;
// Erster Tag der Aufzeichnung. Häuser, die an diesem Tag schon gelistet waren,
// standen evtl. schon länger im Angebot -> Dauern sind dann Mindestwerte.
let trackStart = null;

function dauerText(von, bis, kurz=false){
  if(!von || !bis) return "–";
  return (von===trackStart ? (kurz ? "≥&nbsp;" : "mind. ") : "") + daysBetween(von, bis) + "&nbsp;Tage";
}
function longBadge(punkte){
  if(!punkte.length) return "";
  return daysBetween(punkte[0].datum, todayIso())>=LONG_LISTED_DAYS
    ? `<span class="badge long">lange im Angebot</span>` : "";
}

// Änderungs-Feed: alle Ereignisse aus der Historie, neueste zuerst
function buildEvents(history){
  const ev=[];
  let startCount=0;
  Object.values(history).forEach(h=>{
    const pts=(h.punkte||[]);
    pts.forEach((pt,i)=>{
      if(i===0){
        if(pt.datum===trackStart) startCount++;
        else ev.push({ d:pt.datum, type:"new", addr:h.addr, text:`neu im Angebot für ${formatPrice(pt.preis)}` });
        return;
      }
      const prev=pts[i-1];
      if(pt.preis!=null && prev.preis!=null && pt.preis!==prev.preis){
        const pct=Math.round((pt.preis-prev.preis)/prev.preis*100);
        const down=pt.preis<prev.preis;
        ev.push({ d:pt.datum, type:down?"down":"up", addr:h.addr,
          text:`Preis ${down?"gesenkt":"erhöht"}: ${formatPrice(prev.preis)} → ${formatPrice(pt.preis)} (${pct>0?"+":"−"}${Math.abs(pct)}&nbsp;%)` });
      }
      if(pt.pacht!=null && prev.pacht!=null && pt.pacht!==prev.pacht){
        ev.push({ d:pt.datum, type:"pacht", addr:h.addr,
          text:`Pacht geändert: ${formatPrice(prev.pacht)} → ${formatPrice(pt.pacht)} pro Jahr` });
      }
    });
    if(h.aktiv===false && h.verkauft_am){
      const last=[...pts].reverse().find(p=>p.preis!=null);
      ev.push({ d:h.verkauft_am, type:"sold", addr:h.addr,
        text:`vom Markt genommen (zuletzt angeboten für ${formatPrice(last?.preis)})` });
    }
  });
  if(trackStart) ev.push({ d:trackStart, type:"start", addr:null, text:`Beginn der Aufzeichnung mit ${startCount} Angeboten` });
  return ev.sort((a,b)=>b.d.localeCompare(a.d));
}

function buildFeed(events, visibleDays=4){
  if(!events.length) return "";
  const icon={ new:"+", down:"▼", up:"▲", pacht:"€", sold:"✓", start:"•" };
  const days=[];
  events.forEach(e=>{
    const last=days[days.length-1];
    if(last && last.d===e.d) last.items.push(e); else days.push({ d:e.d, items:[e] });
  });
  const rows=days.map((day,i)=>`
    <div class="feed-day${i>=visibleDays?" more":""}">
      <div class="feed-date">${formatDate(day.d)}</div>
      <div>${day.items.map(e=>`
        <div class="feed-item"><span class="fi-ico fi-${e.type}">${icon[e.type]}</span>
          <div>${e.addr?`<b>${e.addr}</b> · `:""}${e.text}</div></div>`).join("")}
      </div>
    </div>`).join("");
  const toggle = days.length>visibleDays
    ? `<button class="feed-toggle" onclick="this.closest('.feed').classList.toggle('open');this.textContent=this.closest('.feed').classList.contains('open')?'Weniger anzeigen':'Alle ${days.length} Tage anzeigen'">Alle ${days.length} Tage anzeigen</button>`
    : "";
  return `<div class="feed">${rows}${toggle}</div>`;
}

function shortP(v){ if(v==null) return "–"; return v>=1000 ? Math.round(v/1000)+"\u00A0T\u00A0€" : formatPrice(v); }

function addPin(map, latlng, label, kind, popupHtml){
  const m=L.marker(latlng,{ icon:L.divIcon({ className:'ov-pin'+(kind==='sold'?' sold':''), html:`<div class="pp">${label}</div>`, iconSize:[0,0] }), riseOnHover:true }).addTo(map);
  m.bindPopup(popupHtml,{ className:'ov-popup', maxWidth:240, offset:[0,-34] });
  return m;
}
function ovPopupActive(a){
  const p=a.p;
  return `<div class="ovpop active"><div class="ovpop-h">${(p["addr:street"]||"")} ${(p["addr:housenumber"]||"")}</div><div class="ovpop-b">
    <div class="r"><span>Angebotspreis</span><b>${formatPrice(p.preis)}</b></div>
    <div class="r"><span>€ / m²</span><b>${formatPrice(a.qm)}</b></div>
    <div class="r"><span>Fläche</span><b>${p.flaeche||"–"} m²</b></div>
    <div class="r"><span>Pacht / Jahr</span><b>${formatPrice(p.pacht)}</b></div>
    <div class="r"><span>Im Angebot</span><b>${a.punkte.length?dauerText(a.punkte[0].datum, todayIso()):"–"}</b></div>
  </div></div>`;
}
function ovPopupSold(s, sp){
  const h=s.h, punkte=(h.punkte||[]).filter(x=>x.preis!=null);

  return `<div class="ovpop sold"><div class="ovpop-h">${h.addr||"Unbekannt"}</div><div class="ovpop-b">
    <div class="r"><span>Letzter Angebotspreis</span><b>${formatPrice(sp)}</b></div>
    <div class="r"><span>Vom Markt</span><b>${formatDate(h.verkauft_am)}</b></div>
    <div class="r"><span>Im Angebot</span><b>${dauerText(listed, h.verkauft_am)}</b></div>

function initOverview(geo, history, aktiv, sold){
  const el=document.getElementById('ovMap');
  if(!el || typeof L==='undefined') return;
  const map=L.map(el,{ zoomControl:false, scrollWheelZoom:false, attributionControl:true }).setView([51.7027,7.3320],15);
  L.control.zoom({ position:'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{ subdomains:'abcd', maxZoom:20, attribution:'© OpenStreetMap' }).addTo(map);

  const byId={};
  geo.features.forEach(f=>{ const id=f.properties.id||f.properties['@id']; if(id) byId[id]=f; });
  const pts=[], markers=[];

  aktiv.forEach(a=>{
    const f=byId[a.id]; if(!f) return;
    const layer=L.geoJSON(f,{ style:{ color:'#1b4332', weight:1.2, fillColor:'#2f6b4f', fillOpacity:.7 } }).addTo(map);
    const b=layer.getBounds(), c=b.getCenter();
    markers.push(addPin(map,L.latLng(b.getNorth(),c.lng),shortP(a.p.preis),'active',ovPopupActive(a)));
    pts.push(c);
  });
  sold.forEach(s=>{
    const f=byId[s.id]; if(!f) return;
    const layer=L.geoJSON(f,{ style:{ color:'#6f4a2c', weight:1.2, fillColor:'#a9743f', fillOpacity:.55 } }).addTo(map);
    const b=layer.getBounds(), c=b.getCenter();
    const punkte=(s.h.punkte||[]).filter(x=>x.preis!=null);
    const sp=punkte.length?punkte[punkte.length-1].preis:null;
    markers.push(addPin(map,L.latLng(b.getNorth(),c.lng),shortP(sp),'sold',ovPopupSold(s,sp)));
    pts.push(c);
  });

  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.4));

  // Überlappende Labels entzerren (aktuelle Angebote haben Vorrang)
  const declutter=()=>{
    const placed=[];
    markers.map(m=>m.getElement()).filter(Boolean).forEach(el=>{
      el.classList.remove('compact');
      const r=el.querySelector('.pp').getBoundingClientRect();
      const hit=placed.some(q=> r.left<q.right+3 && r.right>q.left-3 && r.top<q.bottom+3 && r.bottom>q.top-3);
      if(hit) el.classList.add('compact'); else placed.push(r);
    });
  };
  map.on('zoomend', declutter);
  setTimeout(declutter, 300);
  setTimeout(()=>map.invalidateSize(),250);
}

function buildScatter(offers){
  const pts=offers.filter(o=>o.p.flaeche&&o.p.preis).map(o=>({
    x:o.p.flaeche, y:o.p.preis,
    addr:(o.p["addr:street"]||"")+" "+(o.p["addr:housenumber"]||"")
  }));
  if(pts.length<3) return '<p class="hint">Zu wenige Angebote für eine sinnvolle Verteilung.</p>';
  const n=pts.length; let sx=0,sy=0,sxy=0,sxx=0;
  pts.forEach(p=>{ sx+=p.x; sy+=p.y; sxy+=p.x*p.y; sxx+=p.x*p.x; });
  const slope=(n*sxy-sx*sy)/((n*sxx-sx*sx)||1);
  const intercept=(sy-slope*sx)/n;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let xlo=Math.min(...xs), xhi=Math.max(...xs), ylo=Math.min(...ys), yhi=Math.max(...ys);
  const xr=(xhi-xlo)||1, yr=(yhi-ylo)||1;
  xlo-=xr*0.14; xhi+=xr*0.14; ylo=Math.max(0,ylo-yr*0.18); yhi+=yr*0.20;
  const W=660,H=380, mL=64,mR=22,mT=20,mB=46, pw=W-mL-mR, ph=H-mT-mB;
  const X=v=>mL+(v-xlo)/(xhi-xlo)*pw;
  const Y=v=>mT+(1-(v-ylo)/(yhi-ylo))*ph;
  const fmtK=v=>Math.round(v/1000)+" T€";
  let grid='', ya='', xa='';
  for(let i=0;i<=4;i++){
    const yv=ylo+(yhi-ylo)*i/4, yy=Y(yv);
    grid+=`<line x1="${mL}" y1="${yy.toFixed(1)}" x2="${W-mR}" y2="${yy.toFixed(1)}" stroke="#efece3"/>`;
    ya+=`<text x="${mL-8}" y="${(yy+3.5).toFixed(1)}" font-size="10.5" fill="#9b9a8c" text-anchor="end" font-family="Hanken Grotesk">${fmtK(yv)}</text>`;
  }
  for(let i=0;i<=4;i++){
    const xv=xlo+(xhi-xlo)*i/4, xx=X(xv);
    xa+=`<text x="${xx.toFixed(1)}" y="${H-mB+18}" font-size="10.5" fill="#9b9a8c" text-anchor="middle" font-family="Hanken Grotesk">${Math.round(xv)} m²</text>`;
  }
  const trend=`<line x1="${X(xlo).toFixed(1)}" y1="${Y(slope*xlo+intercept).toFixed(1)}" x2="${X(xhi).toFixed(1)}" y2="${Y(slope*xhi+intercept).toFixed(1)}" stroke="#b9b3a3" stroke-width="2" stroke-dasharray="6 5"/>`;
  const dots=pts.map(p=>{
    const resid=p.y-(slope*p.x+intercept);
    const col=resid<=0?'#2f6b4f':'#a9743f';
    return `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="6.5" fill="${col}" stroke="#fff" stroke-width="2"/>`;
  }).join('');

  // Labels ohne Überlappung: Jedes Label probiert acht Positionen um seinen
  // Punkt und nimmt die erste, die kein anderes Label und keinen Punkt
  // verdeckt und im Diagramm bleibt (sonst die mit den wenigsten Konflikten).
  const fs=10.5, charW=fs*0.56;
  const gap=10;  // Mindestabstand zwischen Labels
  const hit=(a,b)=>a.x<b.x+b.w+gap && a.x+a.w+gap>b.x && a.y<b.y+b.h+gap && a.y+a.h+gap>b.y;
  const dotBoxes=pts.map(p=>({ x:X(p.x)-9, y:Y(p.y)-9, w:18, h:18 }));
  const placed=[];
  const labels=pts.map((p,i)=>{
    const cx=X(p.x), cy=Y(p.y), w=p.addr.length*charW;
    const cands=[
      [cx, cy-12, "middle"], [cx, cy+13+fs, "middle"],
      [cx+11, cy+fs*0.35, "start"], [cx-11, cy+fs*0.35, "end"],
      [cx+7, cy-9, "start"], [cx-7, cy-9, "end"],
      [cx+7, cy+9+fs, "start"], [cx-7, cy+9+fs, "end"]
    ].map(([tx,ty,anchor])=>{
      const box={ x:anchor==="middle"?tx-w/2:anchor==="end"?tx-w:tx, y:ty-fs, w, h:fs+3 };
      const out=box.x<mL+2 || box.x+box.w>W-mR || box.y<2 || box.y+box.h>H-mB;
      const score=placed.filter(b=>hit(box,b)).length + dotBoxes.filter((b,j)=>j!==i && hit(box,b)).length + (out?10:0);
      return { tx, ty, anchor, box, score };
    });
    const best=cands.find(c=>c.score===0) || cands.reduce((a,b)=>b.score<a.score?b:a);
    placed.push(best.box);
    return `<text x="${best.tx.toFixed(1)}" y="${best.ty.toFixed(1)}" font-size="${fs}" fill="#6f6f64" text-anchor="${best.anchor}" font-family="Hanken Grotesk" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${p.addr}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${grid}
    <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${H-mB}" stroke="#e0dccf"/>
    <line x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}" stroke="#e0dccf"/>
    ${trend}${dots}${labels}${ya}${xa}
    <text x="${W-mR}" y="${H-6}" font-size="10.5" fill="#9b9a8c" text-anchor="end" font-family="Hanken Grotesk">Fläche →</text>
  </svg>`;
}

function renderCosts(years){
  const el=document.getElementById('costBars'); if(!el) return;
  const offers=(window.__offers||[]).map(o=>{
    const kauf=o.p.preis||0, pachtJ=o.p.pacht||0, pacht=pachtJ*years;
    return { nm:(o.p["addr:street"]||"")+" "+(o.p["addr:housenumber"]||""), kauf, pacht, total:kauf+pacht };
  }).sort((a,b)=>a.total-b.total);
  if(!offers.length){ el.innerHTML=''; return; }
  const max=Math.max(...offers.map(o=>o.total))||1;
  el.innerHTML=offers.map(o=>`
    <div class="cost-row">
      <div class="nm">${o.nm}</div>
      <div class="cost-track">
        <div class="cost-seg-kauf" style="width:${(o.kauf/max*100).toFixed(1)}%" title="Kaufpreis ${formatPrice(o.kauf)}"></div>
        <div class="cost-seg-pacht" style="width:${(o.pacht/max*100).toFixed(1)}%" title="Pacht ${formatPrice(o.pacht)}"></div>
      </div>
      <div class="cost-total">${formatPrice(o.total)}</div>
    </div>`).join('');
}

    html+=`<div class="section">Was ist neu? <span class="count">alle Änderungen, neueste zuerst</span></div>${buildFeed(events)}`;
  }
  html+=`<div class="section">Lage – Angebote &amp; Verkäufe</div>
    <div class="ovmap-card">
      <div class="ovmap" id="ovMap"></div>
      <div class="ovmap-legend">
        <span class="li"><span class="sw" style="background:#2f6b4f"></span>Aktuelles Angebot · Angebotspreis</span>
        <span class="li"><span class="sw" style="background:#a9743f"></span>Vom Markt · letzter Angebotspreis</span>
        <span class="li" id="ovEmpty" style="color:#9b9a8c;font-style:italic"></span>
      </div>
    </div>`;

  if(aktiv.length){
    const preise=aktiv.map(a=>a.p.preis);
    const flaechen=aktiv.map(a=>a.p.flaeche).filter(Boolean);
    const pachten=aktiv.map(a=>a.p.pacht).filter(Boolean);
    const qms=aktiv.map(a=>a.qm).filter(x=>x!=null);
    const medianQm=median(qms);

    const kpi=(label,value,sub)=>`<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub2">${sub}</div>`:""}</div>`;

    html+=`<div class="section">Marktüberblick <span class="count">aktuelle Angebote</span></div>`;
    html+=`<div class="kpis">
      ${kpi("Häuser zu verkaufen", aktiv.length)}
      ${kpi("Median-Preis", formatPrice(median(preise)), "Ø "+formatPrice(mean(preise)))}
      ${kpi("Median €/m²", formatPrice(medianQm), "Ø "+formatPrice(mean(qms)))}
      ${kpi("Preisspanne", `<span class="v-long">${formatPrice(Math.min(...preise))} – ${formatPrice(Math.max(...preise))}</span><span class="v-short">${kurzT(Math.min(...preise))}&thinsp;–&thinsp;${kurzT(Math.max(...preise))}&nbsp;T€</span>`)}
      ${kpi("Median-Pacht / Jahr", formatPrice(median(pachten)))}
      ${kpi("Median-Fläche", (median(flaechen)||"–")+" m²")}
    </div>`;
    html+=`<p class="note">Bei kleiner Anzahl Angebote ist der Median aussagekräftiger als der Mittelwert.</p>`;

    const {priceSeries, qmSeries, pachtSeries, countSeries}=reconstructMarket(history, flaecheById);
    html+=`<div class="section">Marktentwicklung über Zeit <span class="count">Median aller Angebote am jeweiligen Tag</span></div>`;
    html+=`<div class="charts">
      <div class="chart-card"><h3>Median-Preis</h3>${lineChartSlot("preis", priceSeries, formatPrice)}</div>
      <div class="chart-card"><h3>Median €/m²</h3>${lineChartSlot("qm", qmSeries, formatPrice)}</div>
      <div class="chart-card"><h3>Median-Pacht / Jahr</h3>${lineChartSlot("pacht", pachtSeries, formatPrice)}</div>
      <div class="chart-card"><h3>Anzahl Angebote</h3>${lineChartSlot("anzahl", countSeries, v=>Math.round(v))}</div>
    </div>`;

    html+=`<div class="section">Preis &amp; Fläche im Vergleich</div>
     <div class="chart-card" style="padding:18px 18px 14px">
       ${buildScatter(aktiv)}
       <div class="scatter-legend">
         <span><span class="d" style="background:#2f6b4f"></span>günstiger als erwartet</span>
         <span><span class="d" style="background:#a9743f"></span>teurer als erwartet</span>
         <span><span class="dash"></span>Markttrend</span>
       </div>
       <p class="note" style="margin-top:10px">Jeder Punkt ist ein Angebot. Häuser unter der Trendlinie sind im Verhältnis zur Fläche günstiger.</p>
     </div>`;

    html+=`<div class="section">Gesamtkosten über die Zeit <span class="count">Kaufpreis + Pacht</span></div>
     <div class="chart-card">
       <div class="cost-controls">
         <label for="yrs">Betrachtungszeitraum</label>
         <input type="range" id="yrs" min="1" max="30" value="15" step="1">
         <span class="yr"><span id="yrsVal">15</span> Jahre</span>
       </div>
       <div class="cost-legend">
         <span><span class="d" style="background:#2f6b4f"></span>Kaufpreis</span>
         <span><span class="d" style="background:#a9743f"></span>Pacht über den Zeitraum</span>
       </div>
       <div id="costBars"></div>
       <p class="note" style="margin-top:12px">Über lange Zeiträume kann ein günstiges Haus mit hoher Pacht teurer werden als ein teureres mit niedriger Pacht.</p>
     </div>`;

    html+=`<div class="section">Aktuelle Angebote <span class="count">günstigster €/m² zuerst</span></div><div class="cards">`;
    aktiv.sort((a,b)=>(a.qm||0)-(b.qm||0));
    aktiv.forEach(a=>{
      const p=a.p;
      const punkte=a.punkte.filter(x=>x.preis!=null);
      // Preislinie nur bei echten Preisänderungen; sonst ein kurzer Hinweis
      // (außer bei ganz neuen Angeboten, da steht schon "seit …").
      const neu = punkte.length===1 && punkte[0].datum!==trackStart && daysBetween(punkte[0].datum, todayIso())<30;
      const verlauf = priceChanged(punkte)
        ? `<div class="price-history">${buildSparkline(punkte)}</div>${priceDeltaHtml(punkte)}`
        : (neu ? "" : priceDeltaHtml(punkte));
      // Verlaufstabelle nur, wenn es mehr als einen Eintrag gibt – zugeklappt
      let rows="";
      [...punkte].reverse().forEach(pt=>{
        rows+=`<tr><td>${formatDate(pt.datum)}</td><td>${formatPrice(pt.preis)}</td><td>${pt.pacht!=null?formatPrice(pt.pacht):"–"}</td></tr>`;
      });
      const tabelle = punkte.length>1
        ? `<details class="hist-details"><summary>Verlauf · ${punkte.length} Einträge</summary><table class="htable"><tr><th>Stand</th><th>Preis</th><th>Pacht</th></tr>${rows}</table></details>`
        : "";
      html+=`<div class="card">
        <div class="card-head">
          <h2>${p["addr:street"]||""} ${p["addr:housenumber"]||""}</h2>
          <div class="big-price">${formatPrice(p.preis)}</div>
        </div>
        <div style="margin-top:8px">${badge(a.qm, medianQm)}${longBadge(punkte)}</div>
        <div class="listed">Im Angebot: ${punkte.length?`${dauerText(punkte[0].datum, todayIso())}${punkte[0].datum===trackStart?"":` · seit ${formatDate(punkte[0].datum)}`}`:"–"}</div>
        <div class="statline">
          <div class="statbox"><div class="k">€ / m²</div><div class="v">${formatPrice(a.qm)}</div></div>
          <div class="statbox"><div class="k">Fläche</div><div class="v">${p.flaeche||"–"} m²</div></div>
          <div class="statbox"><div class="k">Pacht/Jahr</div><div class="v">${formatPrice(p.pacht)}</div></div>
        </div>
        ${verlauf}
        ${tabelle}
      </div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<p class="empty">Aktuell keine Häuser zum Verkauf.</p>`;
  }

  const sold2=sold;
  if(sold2.length){
    html+=`<div class="section">Vom Markt genommen <span class="count">vermutlich verkauft</span></div><div class="cards">`;
    sold2.sort((a,b)=>(b.h.verkauft_am||"").localeCompare(a.h.verkauft_am||""));
    sold2.forEach(({h})=>{
      const punkte=(h.punkte||[]).filter(x=>x.preis!=null);
      const gelistetSeit=punkte.length?punkte[0].datum:null;
      const ersterPreis=punkte.length?punkte[0].preis:null;
      const letzterPreis=punkte.length?punkte[punkte.length-1].preis:null;
      const pct=(ersterPreis&&letzterPreis)?Math.round((letzterPreis-ersterPreis)/ersterPreis*100):null;
      html+=`<div class="card sold">
        <div class="card-head"><h2>${h.addr||"Unbekannt"}</h2><div class="big-price">${formatPrice(letzterPreis)}</div></div>
        <div class="listed">letzter Angebotspreis</div>
        <div class="statline">
          <div class="statbox"><div class="k">Vom Markt</div><div class="v" style="font-size:13px">${formatDate(h.verkauft_am)}</div></div>
          <div class="statbox"><div class="k">Im Angebot</div><div class="v">${dauerText(gelistetSeit, h.verkauft_am, true)}</div></div>
          <div class="statbox"><div class="k">Preisänderung</div><div class="v">${pct==null?"–":pct===0?"keine":(pct>0?"+":"−")+Math.abs(pct)+"&nbsp;%"}</div></div>
        </div>
      </div>`;
    });
    html+=`</div>`;
    html+=`<p class="note">Der tatsächliche Verkaufspreis ist nicht bekannt – angegeben ist der letzte Preis aus der Verkaufsliste. „mind.“ bzw. „≥“ heißt: Das Haus war schon vor Beginn der Aufzeichnung (${formatDate(trackStart)}) im Angebot, die echte Dauer ist also länger.</p>`;
  }

  root.innerHTML = html || '<p class="empty">Keine Daten vorhanden.</p>';
  initLineCharts();
  initOverview(geo, history, aktiv, sold);
  const ovEmpty=document.getElementById('ovEmpty');
  if(ovEmpty) ovEmpty.textContent = sold.length ? '' : 'Noch keine Verkäufe erfasst – verkaufte Häuser erscheinen hier automatisch.';
  window.__offers=aktiv;
  const yrs=document.getElementById('yrs');
  if(yrs){ const lab=document.getElementById('yrsVal'); const upd=()=>{ lab.textContent=yrs.value; renderCosts(+yrs.value); }; yrs.addEventListener('input',upd); upd(); }
}).catch(err=>{
  console.error(err);
  document.getElementById('content').innerHTML='<p class="empty">Daten konnten nicht geladen werden.</p>';
});
</script>
</body>
</html>
